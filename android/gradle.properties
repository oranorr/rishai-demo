org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false

# Оптимизация для поддержки 16 KB страниц памяти Android 15+
# Включение R8 для лучшей оптимизации кода
android.enableR8.fullMode=true
android.enableR8=true

# Оптимизация сборки для уменьшения размера APK
android.enableD8.desugaring=true
android.enableD8=true

# Настройки для поддержки 16 KB страниц памяти
android.enableResourceOptimizations=true
android.enableProguardInReleaseBuilds=true

# Оптимизация Gradle для быстрой сборки
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
